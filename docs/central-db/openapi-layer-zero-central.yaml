openapi: 3.0.3
info:
  title: Layer Zero Central API
  version: 1.0.0
  description: 다중기기 동기화를 위한 Layer Zero 중앙 API
servers:
  - url: https://api.layerzero.local

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    cursorParam:
      name: cursor
      in: query
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    AuthLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: email 또는 username
        password:
          type: string

    AuthTokenResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            username: { type: string }

    UserSettings:
      type: object
      properties:
        printerName: { type: string }
        klipperHost: { type: string }
        webcamUrl1: { type: string }
        webcamUrl2: { type: string }
        theme: { type: string }
        language: { type: string }
        weatherCity: { type: string }
        weatherLat: { type: number }
        weatherLon: { type: number }
        filamentCostPerKg: { type: number }
        electricityCostPerKwh: { type: number }
        dashboardPollMs: { type: integer }
        dashboardStatsPollMs: { type: integer }
        notifyPrintComplete: { type: boolean }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }

    UserSettingsUpsertRequest:
      allOf:
        - $ref: '#/components/schemas/UserSettings'
      properties:
        expectedVersion:
          type: integer
          description: 낙관적 락 버전(충돌 감지용)

    BedMeshHistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        source: { type: string }
        filename: { type: string }
        rows: { type: integer }
        cols: { type: integer }
        min: { type: number }
        max: { type: number }
        avg: { type: number }
        matrix:
          type: array
          items:
            type: array
            items:
              type: number

    BedMeshHistoryCreateRequest:
      type: object
      required: [rows, cols, matrix]
      properties:
        source: { type: string, default: home-auto-level }
        filename: { type: string }
        rows: { type: integer }
        cols: { type: integer }
        min: { type: number }
        max: { type: number }
        avg: { type: number }
        matrix:
          type: array
          items:
            type: array
            items:
              type: number

    ReportItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        state: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationSec: { type: integer }
        progress: { type: number }
        quality:
          type: object
        keyIssues:
          type: array
          items: { type: string }
        cost:
          type: object

    ReportCreateRequest:
      type: object
      required: [createdAt]
      properties:
        filename: { type: string }
        state: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationSec: { type: integer }
        progress: { type: number }
        quality: { type: object }
        keyIssues:
          type: array
          items: { type: string }
        cost: { type: object }
        qualityTimeline:
          type: array
          items: { type: object }
        costTimeline:
          type: array
          items: { type: object }
        alertTimeline:
          type: array
          items: { type: object }

    MaintenanceLogItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        detail: { type: string }
        createdAt: { type: string, format: date-time }

    MaintenanceLogCreateRequest:
      type: object
      required: [action]
      properties:
        action: { type: string }
        detail: { type: string }

    ChecklistItem:
      type: object
      required: [checklistKey, label, done]
      properties:
        checklistKey: { type: string }
        label: { type: string }
        period: { type: string }
        done: { type: boolean }
        updatedAt: { type: string, format: date-time }

    ChatSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        modelMode: { type: string, enum: [free, paid] }
        modelName: { type: string }
        pinned: { type: boolean }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        createdAt: { type: string, format: date-time }

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      responses:
        '200':
          description: refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /v1/settings:
    get:
      tags: [Settings]
      responses:
        '200':
          description: current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
    put:
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpsertRequest'
      responses:
        '200':
          description: updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '409':
          description: version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/mesh-history:
    get:
      tags: [Mesh]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BedMeshHistoryItem'
                  nextCursor:
                    type: string
    post:
      tags: [Mesh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedMeshHistoryCreateRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedMeshHistoryItem'

  /v1/mesh-history/{id}:
    delete:
      tags: [Mesh]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: deleted

  /v1/reports:
    get:
      tags: [Reports]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportItem'
                  nextCursor:
                    type: string
    post:
      tags: [Reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportItem'

  /v1/reports/{id}:
    get:
      tags: [Reports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportItem'
    delete:
      tags: [Reports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: deleted

  /v1/maintenance/logs:
    get:
      tags: [Maintenance]
      parameters:
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceLogItem'
    post:
      tags: [Maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceLogCreateRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogItem'

  /v1/maintenance/checklist:
    get:
      tags: [Maintenance]
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChecklistItem'
    put:
      tags: [Maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChecklistItem'
      responses:
        '200':
          description: updated

  /v1/chat/sessions:
    get:
      tags: [Chat]
      parameters:
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatSession'
    post:
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                modelMode: { type: string, enum: [free, paid] }
                modelName: { type: string }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'

  /v1/chat/sessions/{sessionId}/messages:
    get:
      tags: [Chat]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
    post:
      tags: [Chat]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, content]
              properties:
                role: { type: string, enum: [user, assistant, system] }
                content: { type: string }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'

  /v1/sync/bootstrap:
    get:
      tags: [Sync]
      description: 앱 최초 진입 시 필요한 핵심 데이터 일괄 로드
      responses:
        '200':
          description: bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: '#/components/schemas/UserSettings'
                  maintenanceChecklist:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChecklistItem'
                  latestMeshHistory:
                    type: array
                    items:
                      $ref: '#/components/schemas/BedMeshHistoryItem'
                  latestReports:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportItem'

